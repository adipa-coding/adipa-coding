<svg xmlns="http://www.w3.org/2000/svg" width="900" height="6">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#0d0d0d"/>
      <stop offset="20%"  stop-color="#003300"/>
      <stop offset="50%"  stop-color="#00FF41"/>
      <stop offset="80%"  stop-color="#00c6ff"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <filter id="blur2"><feGaussianBlur stdDeviation="1.5"/></filter>
    <style>
      .gl { animation: pulse 2.5s ease-in-out infinite alternate; }
      @keyframes pulse {
        from { opacity: .4; filter: drop-shadow(0 0 3px #00FF41); }
        to   { opacity: 1;  filter: drop-shadow(0 0 8px #00c6ff); }
      }
    </style>
  </defs>
  <!-- glow blur layer -->
  <rect x="0" y="1" width="900" height="4" fill="url(#dg)" filter="url(#blur2)" opacity=".6"/>
  <!-- sharp line on top -->
  <rect class="gl" x="0" y="2" width="900" height="2" fill="url(#dg)"/>
</svg>
